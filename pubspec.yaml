name: humana
description: "Humana is an application for managing employee attendance."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  forui: ^0.16.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_svg: ^2.2.3
  camera: ^0.11.3
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  google_mlkit_face_detection: ^0.13.1
  shared_preferences: ^2.5.3
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.8
  intl: ^0.20.2
  http: ^1.6.0
  http_parser: ^4.1.2
  image: ^4.3.0

  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  flutter_launcher_icons: ^0.14.4
  supabase_flutter: ^2.12.0
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  file_picker: ^8.1.4

dev_dependencies:
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#0E0F13"
  image: assets/logo/logo_shift.png
  android_12:
    image: assets/logo/logo_shift.png
    icon_background_color: "#0E0F13"

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo/logo_shift.png"


flutter:
  assets:
    - assets/logo/logo_shift.png

  uses-material-design: true
